<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload experience – HireHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="gradient-bg saas-body">
    <div class="bg-mesh" aria-hidden="true"></div>

    <header class="navbar">
        <div class="navbar-inner">
            <a href="{{ url_for('dashboard') }}" class="navbar-brand">
                <span class="navbar-logo">HH</span>
                <span class="navbar-title">HireHub</span>
            </a>
            <nav class="navbar-nav" aria-label="Main">
                <a href="{{ url_for('senior') }}" class="nav-link">Back</a>
                <a href="{{ url_for('logout') }}" class="nav-link">Log out</a>
            </nav>
        </div>
    </header>

    <main class="main-auth main-upload">
        <div class="container auth-container">
            <div class="glass-card form-card form-card-wide">
                <h1 class="form-heading">Upload placement experience</h1>
                <p class="form-lead">Help juniors with concrete details—every field helps.</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
                {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('upload') }}" class="form">
                    <label for="senior_name">Your name</label>
                    <input type="text" id="senior_name" name="senior_name" required autocomplete="name" placeholder="Full name as shown to juniors" />

                    <label for="company">Company name</label>
                    <input type="text" id="company" name="company" required />

                    <label for="passout_year">Pass-out year</label>
                    <input type="number" id="passout_year" name="passout_year" required min="1990" max="2035" step="1" placeholder="e.g. 2025" />

                    <label for="role">Role</label>
                    <input type="text" id="role" name="role" required />

                    <label for="questions">Interview questions</label>
                    <textarea id="questions" name="questions" rows="4" placeholder="Key questions that were asked…"></textarea>

                    <label for="prep">Preparation strategy</label>
                    <textarea id="prep" name="prep" rows="4" placeholder="How you prepared…"></textarea>

                    <label for="courses">Courses / certifications</label>
                    <textarea id="courses" name="courses" rows="3" placeholder="Helpful resources…"></textarea>

                    <button type="submit" class="btn btn-primary btn-block">Submit experience</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
