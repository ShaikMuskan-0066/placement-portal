<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit experience – HireHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="gradient-bg saas-body">
    <div class="bg-mesh" aria-hidden="true"></div>

    <header class="navbar">
        <div class="navbar-inner">
            <a href="{{ url_for('senior') }}" class="navbar-brand">
                <span class="navbar-logo">HH</span>
                <span class="navbar-title">HireHub</span>
            </a>
            <nav class="navbar-nav" aria-label="Main">
                <a href="{{ url_for('senior') }}" class="nav-link">Back</a>
                <a href="{{ url_for('logout') }}" class="nav-link">Log out</a>
            </nav>
        </div>
    </header>

    <main class="main-auth main-upload">
        <div class="container auth-container">
            <div class="glass-card form-card form-card-wide edit-form-card">
                <h1 class="form-heading">Edit experience</h1>
                <p class="form-lead">Change any field below and click Update.</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
                {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('edit_experience', experience_id=exp.id) }}" class="form form--edit">
                    <label for="senior_name">Name</label>
                    <input type="text" id="senior_name" name="senior_name" required autocomplete="name" value="{{ exp.senior_name or '' }}" />

                    <label for="passout_year">Pass-out year</label>
                    <input type="number" id="passout_year" name="passout_year" required min="1990" max="2035" step="1" value="{{ exp.passout_year if exp.passout_year is not none else '' }}" />

                    <label for="company">Company</label>
                    <input type="text" id="company" name="company" required value="{{ exp.company or '' }}" />

                    <label for="role">Role</label>
                    <input type="text" id="role" name="role" required value="{{ exp.role or '' }}" />

                    <label for="questions">Questions</label>
                    <textarea id="questions" name="questions" rows="5" placeholder="Interview questions you faced">{{ exp.questions or '' }}</textarea>

                    <label for="prep">Preparation</label>
                    <textarea id="prep" name="prep" rows="5" placeholder="How you prepared">{{ exp.prep or '' }}</textarea>

                    <label for="courses">Courses</label>
                    <textarea id="courses" name="courses" rows="4" placeholder="Courses or certifications">{{ exp.courses or '' }}</textarea>

                    <button type="submit" class="btn btn-primary btn-block">Update</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
